name: "Build with NPM"
inputs:
  token:
    description: "Github Token"
    required: true
  app-type:
    description: "next-js | vite | npm-ui-lib"
    required: false
  sentry-token:
    description: "Sentry Auth Token"
    required: false
  sentry-org:
    description: "Sentry Organization Name"
    required: false
  sentry-project:
    description: "Sentry Project Name"
    required: false
  with-storybook:
    description: "true | false"
    required: false
  skip-tests:
    description: "true | false"
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        registry-url: "https://npm.pkg.github.com"

    - name: Hash package-lock.json
      shell: bash
      run: echo "PACKAGE_LOCK_FILE_HASH=$(tail -n +10 package-lock.json | sha1sum | head -c 40)" >> $GITHUB_ENV

    - name: Get npm cache directory
      id: npm-cache-dir
      shell: bash
      run: |
        echo "::set-output name=dir::$(npm config get cache)"

    - uses: actions/cache@v3
      id: npm-cache
      with:
        path: |
          ${{ steps.npm-cache-dir.outputs.dir }}
          ${{ github.workspace }}/node_modules
          ${{ github.workspace }}/.next/cache
          ${{ github.workspace }}/node_modules/.vite
        key: ${{ runner.os }}-node-${{ env.PACKAGE_LOCK_FILE_HASH }}-${{ env.PACKAGE_LOCK_FILE_HASH }}
        restore-keys: |
          ${{ runner.os }}-node-${{ env.PACKAGE_LOCK_FILE_HASH }}-

    - name: Install Dependencies
      shell: bash
      run: npm ci --include=dev
      env:
        NODE_AUTH_TOKEN: ${{ inputs.token }}

    - name: Run Lint
      shell: bash
      run: npm run lint

    - name: Build with NPM
      shell: bash
      run: npm run build

    - name: Run Tests
      if: ${{ inputs.skip-tests != 'true' }}
      shell: bash
      run: npm run test:ci

    - name: Generate Test Coverage Badges
      if: ${{ github.event_name != 'pull_request' && inputs.skip-tests != 'true' }}
      uses: jpb06/coverage-badges-action@latest
      with:
        branches: "*"
        commit-message: "${{github.event.pull_request.title}} - Coverage badges"
        commit-user: GitHub Action
        commit-user-email: action@github.com
        output-folder: .github/badges

    - name: Push the coverage badges and summary file
      shell: bash
      if: ${{ github.event_name != 'pull_request' && inputs.skip-tests != 'true' }}
      run: |
        if [[ `git status --porcelain *.svg *.json` ]]; then
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git push
        fi

    - name: Report test coverage
      if: ${{ inputs.skip-tests != 'true' }}
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.token }}
        script: |
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
          const metrics = ['statements', 'branches', 'functions', 'lines'];
          const rows = metrics.map(metric => {
            const result = summary.total?.[metric];
            if (!result || !Number.isFinite(result.pct) || result.pct < 0 || result.pct > 100 ||
                !Number.isFinite(result.covered) || !Number.isFinite(result.total)) {
              throw new Error(`Invalid coverage summary metric: ${metric}`);
            }
            return `| ${metric} | ${result.pct}% | ${result.covered}/${result.total} |`;
          });
          const marker = '<!-- npm-test-coverage -->';
          const report = [marker, '## Test coverage', '',
            '| Metric | Coverage | Covered / Total |', '| --- | ---: | ---: |', ...rows].join('\n');
          await core.summary.addRaw(report).write();
          if (context.eventName !== 'pull_request') return;
          const params = { ...context.repo, issue_number: context.issue.number };
          const comments = await github.paginate(github.rest.issues.listComments, params);
          const previous = comments.find(comment => comment.body?.startsWith(marker));
          if (previous) {
            await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body: report });
          } else {
            await github.rest.issues.createComment({ ...params, body: report });
          }

    - name: Create Sentry release
      uses: getsentry/action-release@v1
      if: ${{ inputs.sentry-token != '' }}
      env:
        SENTRY_AUTH_TOKEN: ${{ inputs.sentry-token }}
        SENTRY_ORG: ${{ inputs.sentry-org }}
        SENTRY_PROJECT: ${{ inputs.sentry-project }}
      with:
        version: ${{ env.LATEST_TAG }}
        sourcemaps: ${{ inputs.app-type == 'next-js' && '.next' || 'dist' }}
        ignore_missing: "true"
        ignore_empty: "true"
