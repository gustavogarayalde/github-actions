name: "Run Maven Tests"
description: "Runs the complete Maven test suite and updates JaCoCo coverage badges"
inputs:
  settings-url:
    description: "URL to settings.xml file"
    required: false
  token:
    description: "Github Token"
    required: false
  docker-images:
    description: "Newline-separated Docker images used by Testcontainers"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: "temurin"
        java-version: "25"

    - name: Hash Pom
      shell: bash
      run: echo "POM_FILE_HASH=$(tail -n +10 pom.xml | sha1sum | head -c 40)" >> $GITHUB_ENV

    - name: Cache local Maven repository
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ env.POM_FILE_HASH }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Set up settings
      if: ${{ inputs.settings-url != '' }}
      shell: bash
      run: |
        curl -o ~/.m2/settings.xml -L https://${{inputs.token}}@${{inputs.settings-url}}
        sed -i "s/MAVEN_USER/$GITHUB_ACTOR/" ~/.m2/settings.xml
        sed -i "s/MAVEN_TOKEN/${{inputs.token}}/" ~/.m2/settings.xml

    - name: Maven Validate
      shell: bash
      run: mvn validate --file pom.xml

    - name: Calculate Testcontainers image cache key
      id: testcontainers-image-key
      if: ${{ inputs.docker-images != '' }}
      shell: bash
      env:
        DOCKER_IMAGES: ${{ inputs.docker-images }}
      run: |
        IMAGE_HASH=$(printf '%s' "$DOCKER_IMAGES" | sha256sum | cut -d ' ' -f 1)
        echo "hash=$IMAGE_HASH" >> "$GITHUB_OUTPUT"

    - name: Restore Testcontainers images
      id: testcontainers-image-cache
      if: ${{ inputs.docker-images != '' }}
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/testcontainers-images.tar
        key: testcontainers-${{ runner.os }}-${{ runner.arch }}-${{ steps.testcontainers-image-key.outputs.hash }}

    - name: Load cached Testcontainers images
      if: ${{ inputs.docker-images != '' && steps.testcontainers-image-cache.outputs.cache-hit == 'true' }}
      shell: bash
      run: docker load --input "${{ runner.temp }}/testcontainers-images.tar"

    - name: Pull and cache Testcontainers images
      if: ${{ inputs.docker-images != '' && steps.testcontainers-image-cache.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        DOCKER_IMAGES: ${{ inputs.docker-images }}
      run: |
        mapfile -t IMAGES < <(printf '%s\n' "$DOCKER_IMAGES" | sed '/^[[:space:]]*$/d')
        printf '%s\n' "${IMAGES[@]}" | xargs -n 1 -P 4 docker pull
        docker save --output "${{ runner.temp }}/testcontainers-images.tar" "${IMAGES[@]}"

    - name: Maven Unit and E2E Tests
      shell: bash
      run: mvn -B test --file pom.xml

    - name: Generate Test Coverage Badges
      uses: cicirello/jacoco-badge-generator@v2
      with:
        generate-branches-badge: true
        generate-summary: true

    - name: Commit and push the coverage badges and summary file
      shell: bash
      if: ${{ github.event_name != 'pull_request' }}
      run: |
        if [[ `git status --porcelain *.svg *.json` ]]; then
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add *.svg *.json
          git commit -m "Update coverage badges" *.svg *.json
          git push
        fi

    - name: Comment on PR with coverage percentages
      shell: bash
      if: ${{ github.event_name == 'pull_request' }}
      run: |
        REPORT=$(<.github/badges/coverage-summary.json)
        COVERAGE=$(jq -r '.coverage' <<< "$REPORT")%
        BRANCHES=$(jq -r '.branches' <<< "$REPORT")%
        NEWLINE=$'\n'
        BODY="## JaCoCo Test Coverage Summary Statistics${NEWLINE}* __Coverage:__ ${COVERAGE}${NEWLINE}* __Branches:__ ${BRANCHES}"
        gh pr comment ${{github.event.pull_request.number}} -b "${BODY}"
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
