name: "Tag Version"
inputs:
  token:
    description: "A Github token"
    required: true
  build-tool:
    description: "maven | npm | gradle"
    required: true
  app-type:
    description: "spring-boot | next-js | vite | npm-ui-lib | android-app"
    required: false

runs:
  using: "composite"
  steps:
    - name: Git Config
      shell: bash
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Record existing tags
      shell: bash
      run: |
        TAGS_BEFORE_FILE=$(mktemp)
        git tag --list | LC_ALL=C sort > "$TAGS_BEFORE_FILE"
        echo "TAGS_BEFORE_FILE=$TAGS_BEFORE_FILE" >> "$GITHUB_ENV"

    - uses: gustavogarayalde/github-actions/actions/tag/pr@v0.0.32
      name: Tag PR
      if: ${{ github.event_name == 'pull_request' }}
      with:
        app-type: ${{ inputs.app-type }}
        build-tool: ${{ inputs.build-tool }}
        token: ${{ inputs.token }}

    - uses: gustavogarayalde/github-actions/actions/release@v0.0.32
      name: Release
      if: ${{ github.event_name != 'pull_request' }}
      with:
        app-type: ${{ inputs.app-type }}
        build-tool: ${{ inputs.build-tool }}
        token: ${{ inputs.token }}

    - name: Push tag
      shell: bash
      run: |
        mapfile -t NEW_TAGS < <(LC_ALL=C comm -13 "$TAGS_BEFORE_FILE" <(git tag --list | LC_ALL=C sort))
        if [[ ${#NEW_TAGS[@]} -ne 1 ]]; then
          echo "::error::Expected exactly one new release tag, found ${#NEW_TAGS[@]}."
          exit 1
        fi
        RELEASE_TAG=${NEW_TAGS[0]}
        git push origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
        echo "LATEST_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
