name: Tag Release

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write

# This workflow and test both push commits to the current branch. Using the
# same concurrency group prevents non-fast-forward failures between them.
concurrency:
  group: repository-write-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
    - uses: gustavogarayalde/github-actions/actions/tag-release@versionTag
      with:
        token: ${{ secrets.PAT }}
        build-tool: maven # maven | npm | gradle
        repository: maven # maven | npm | docker | google-play
        app-type: spring-boot # spring-boot | next-js | vite | npm-ui-lib | android-app
        settings-url: raw.githubusercontent.com/OWNER/devops/main/maven/settings.xml # only for maven build-tool
        # Android-specific parameters (only for gradle build-tool & google-play repository):
        # service-account-json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        # package-name: com.yourcompany.yourapp
        # track: internal # internal | alpha | beta | production
        # Android signing parameters (required for signed releases):
        # keystore: ${{ secrets.ANDROID_KEYSTORE }}
        # keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
        # key-alias: ${{ secrets.KEY_ALIAS }}
        # key-password: ${{ secrets.KEY_PASSWORD }}
