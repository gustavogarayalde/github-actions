name: Unit and E2E Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# This workflow and tag-release both push commits to the current branch. Using
# the same concurrency group makes the second workflow wait and check out the
# branch only after the first push has completed.
concurrency:
  group: repository-write-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: gustavogarayalde/github-actions/actions/test/maven@versionTag
        with:
          token: ${{ secrets.PAT }}
          settings-url: raw.githubusercontent.com/OWNER/devops/main/maven/settings.xml
          docker-images: |
            IMAGE_NAME:IMAGE_TAG
            testcontainers/ryuk:0.14.0
